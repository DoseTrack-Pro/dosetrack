name: peptidetrack
description: Personal peptide dosing tracker with NFC auto-logging.
publish_to: none
version: 1.0.0+8

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^17.2.0

  # State management
  flutter_riverpod: ^3.3.1

  # Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # NFC: implemented natively in `ios/Runner/NfcReader.swift` and
  # `android/.../NfcReader.kt`, exposed to Dart via MethodChannel from
  # `lib/services/nfc_service.dart`. We deliberately do NOT depend on
  # `flutter_nfc_kit` because its Swift `register(with:)` crashed at launch
  # on iOS 26 + ProMotion (Flutter framework issues #168228 / #183900).

  # Notifications
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0

  # PDF + export
  pdf: ^3.11.1
  printing: ^5.13.1
  share_plus: ^12.0.2
  path_provider: ^2.1.3

  # Charts
  fl_chart: ^1.2.0

  # Utils
  uuid: ^4.4.0
  intl: ^0.20.2
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  file_picker: ^11.0.2
  local_auth: ^3.0.1
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.7

flutter:
  config:
    enable-uiscene-migration: false
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_background: "#1B46B9"
  min_sdk_android: 26
  web:
    generate: false

flutter_native_splash:
  color: "#1B46B9"
  fullscreen: true
  android: true
  ios: true
  android_12:
    color: "#1B46B9"
