name: peptidetrack
description: Personal peptide dosing tracker with NFC auto-logging.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State management
  flutter_riverpod: ^2.5.1

  # Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # NFC
  flutter_nfc_kit: ^3.4.1
  ndef: ^0.3.2

  # Notifications
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4

  # PDF + export
  pdf: ^3.11.1
  printing: ^5.13.1
  share_plus: ^9.0.0
  path_provider: ^2.1.3

  # Charts
  fl_chart: ^0.68.0

  # Utils
  uuid: ^4.4.0
  intl: ^0.19.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  file_picker: ^8.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 26
  web:
    generate: false
